services:
  passivbot-lighter-live:
    build:
      context: .
      dockerfile: Dockerfile_live
    image: passivbot-lighter:latest
    container_name: passivbot-lighter-live
    # Opt-in only: retired project, but folder_list.txt says to move it back before
    # re-enabling, so guard against a bare `docker compose up -d` waking a trader.
    # Start deliberately with: docker compose --profile live up -d
    profiles: ["live"]
    restart: unless-stopped
    volumes:
      - ./:/app/
    working_dir: /app
    environment:
      PASSIVBOT_REMOTE_LIVE: "1"
    command:
      - python
      - src/main.py
      - configs/config_hype.json
      - --live.wfo_rolling.enabled
      - "true"
      - --live.wfo_rolling.active_dir
      - runs/walkforward/live
      - --live.wfo_rolling.check_interval_minutes
      - "1"
      - --live.wfo_rolling.max_loss_flatten_frac
      - "0.02"
    deploy:
      resources:
        limits:
          # Live bot with a 1-minute WFO rolling check; one WS + periodic REST.
          # 1.0 matches the other always-on traders and bounds a reconnect spin.
          cpus: "0.25"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
