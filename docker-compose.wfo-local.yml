services:
  passivbot-wfo-local-manager:
    build:
      context: .
      dockerfile: Dockerfile_wfo
    image: passivbot-lighter-wfo:latest
    container_name: passivbot-wfo-local-manager
    restart: unless-stopped
    # Reuse Docker's default bridge instead of creating a new project network:
    # this host runs many compose stacks and the predefined address pools are
    # exhausted. The manager only needs outbound (SSH to the VPS + Lighter
    # data download), which the default bridge provides.
    network_mode: bridge
    # Unbuffered stdout so watch-loop progress / upload confirmations appear in
    # `docker logs` in real time (Python block-buffers stdout when not a tty,
    # otherwise the "skipping upload" / "Uploaded" lines lag behind by a tick).
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./:/app/
    working_dir: /app
    command:
      - python
      - src/tools/wfo_vps_manager.py
      - watch
      - --profile
      - hype_t12
      - --check-interval-minutes
      - "15"
    deploy:
      resources:
        limits:
          # Watch loop wakes every 15 min to drive the VPS over SSH and download
          # Lighter data — mostly idle, with a data-prep burst per cycle. 2.0 is
          # ample; the heavy optimize runs on the VPS, not in this container.
          cpus: "2.0"
          memory: 8G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
